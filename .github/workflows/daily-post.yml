name: Daily YouTube Post

# Live Mode (the toggle in the Admin Panel) controls whether this actually
# runs — it calls GitHub's API to enable/disable this workflow entirely.
# Runs twice a day, 12 hours apart, while enabled.
#
# NOTE on timing: GitHub Actions cron runs in UTC and does not auto-adjust
# for US Daylight Saving Time. 10:00 and 22:00 UTC = 6:00 AM / 6:00 PM US
# Eastern during Daylight Time (spring–fall, where we are now), but becomes
# 5:00 AM / 5:00 PM Eastern during Standard Time (fall–spring). To keep it
# locked to exactly 6 AM/PM year-round, flip these two values to 11,23 at
# the twice-yearly clock change.
on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the admin panel's post-video endpoint
        run: |
          curl -f -X POST "https://youtube-autopost-ii0e.onrender.com/api/admin/daily-post" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            -d '{"privacyStatus":"public"}'
