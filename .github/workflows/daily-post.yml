name: Daily YouTube Post (Scheduled)

# Live Mode (the toggle in the Admin Panel) controls whether this actually
# runs. Calls daily-post with mode:'schedule' — the app itself queues each
# video with YouTube's own publishAt scheduling, so it goes live at exactly
# your configured target-country time regardless of when this ping fires.
# Running once daily with a comfortable lead time is enough; unlike the
# old design, precise timing no longer matters here.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Queue scheduled posts
        run: |
          curl -f -X POST "https://youtube-autopost-ii0e.onrender.com/api/admin/daily-post" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            -d '{"mode":"schedule"}'
