name: Daily YouTube Post

# Live Mode (the toggle in the Admin Panel) controls whether this actually
# runs — it calls GitHub's API to enable/disable this workflow entirely.
# The schedule below only matters while enabled.
#
# NOTE on timing: GitHub Actions cron runs in UTC and does not auto-adjust
# for US Daylight Saving Time. 22:00 UTC = 6:00 PM US Eastern during
# Daylight Time (spring–fall) but becomes 5:00 PM Eastern during Standard
# Time (fall–spring). If you want it locked to exactly 6:00 PM year-round,
# this cron value needs to be manually flipped between 22:00 and 23:00 UTC
# at the twice-yearly clock change.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the admin panel's post-video endpoint
        run: |
          curl -f -X POST "https://youtube-autopost-ii0e.onrender.com/api/admin/daily-post" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            -d '{"privacyStatus":"public"}'
