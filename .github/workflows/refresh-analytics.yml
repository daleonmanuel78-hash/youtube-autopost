name: Daily Analytics Refresh

on:
  schedule:
    - cron: '0 12 * * *' # noon UTC daily
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the admin panel's refresh-analytics endpoint
        run: |
          curl -f -X POST "https://youtube-autopost-ii0e.onrender.com/api/admin/refresh-analytics" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}"
