name: Daily SEO Generation

# Runs 1 hour before the single daily posting slot (see daily-post.yml) so
# freshly generated metadata is ready in time.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

jobs:
  generate-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the admin panel's generate-seo endpoint
        run: |
          curl -f -X POST "https://youtube-autopost-ii0e.onrender.com/api/admin/generate-seo" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            -d '{"count":10}'
